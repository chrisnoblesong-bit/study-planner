
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 공부 플래너</title>
<style>
:root {
  --bg:#f5f6fb;
  --card:#fff;
  --text:#25283a;
  --muted:#85899b;
  --primary:#7275df;
  --soft:#eeeeff;
  --line:#eceef4;
}
* {box-sizing:border-box}
body {
  margin:0;
  padding:20px 12px 40px;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Noto Sans KR",sans-serif;
}
.app {max-width:720px;margin:auto}
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}
h1 {font-size:21px;margin:0}
.subtitle {font-size:12px;color:var(--muted);margin-top:5px}
.today {
  background:var(--soft);
  color:var(--primary);
  padding:9px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}
.welcome {
  background:linear-gradient(120deg,#7275df,#9698f4);
  color:white;
  padding:25px;
  border-radius:20px;
  margin-bottom:17px;
}
.welcome h2 {margin:0 0 8px;font-size:23px}
.welcome p {margin:0;font-size:13px;opacity:.9}
.card {
  background:var(--card);
  padding:20px;
  border-radius:18px;
  margin-bottom:15px;
  box-shadow:0 7px 25px #2020400a;
}
.card h3 {font-size:16px;margin:0 0 16px}
.date-row,.add-row,.dday-row {
  display:flex;
  gap:8px;
}
input {
  min-width:0;
  padding:12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fafaff;
  font-size:13px;
}
#date {flex:1}
button {
  cursor:pointer;
  border:0;
  border-radius:10px;
  padding:11px 14px;
  font-weight:bold;
}
.primary {
  background:var(--primary);
  color:white;
}
.secondary {
  background:var(--soft);
  color:var(--primary);
}
#taskInput {flex:1;width:100%}
.task {
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 3px;
  border-bottom:1px solid var(--line);
}
.task span {flex:1;font-size:14px;overflow-wrap:anywhere}
.task.done span {
  text-decoration:line-through;
  color:#aaa;
}
.task input {accent-color:var(--primary)}
.task button {
  padding:6px;
  background:transparent;
  color:#888;
  font-size:12px;
}
.empty {
  text-align:center;
  padding:20px;
  color:#999;
  font-size:13px;
}
.progress-info {
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:var(--muted);
  margin:15px 0 8px;
}
.progress {
  height:7px;
  background:#eeeef5;
  border-radius:20px;
  overflow:hidden;
}
#progressBar {
  height:100%;
  width:0;
  background:#49b99b;
  transition:.2s;
}
.dday {
  background:linear-gradient(120deg,#7275df,#9698f4);
  color:white;
}
.dday h3 {color:white}
.dday input {
  flex:1;
  width:100%;
  background:#ffffff20;
  color:white;
  border-color:#ffffff55;
}
.dday input::placeholder {color:#eee}
.dday button {
  background:white;
  color:#7275df;
}
#ddayResult {
  margin-top:17px;
  font-size:14px;
  line-height:1.7;
}
#ddayNumber {
  font-size:32px;
  font-weight:bold;
}
footer {
  text-align:center;
  color:#aaa;
  font-size:11px;
  padding:15px;
}
@media(max-width:480px) {
  body {padding:15px 10px 30px}
  .card {padding:16px}
  .welcome {padding:21px}
  .welcome h2 {font-size:20px}
  .dday-row {flex-wrap:wrap}
  .dday-row input:first-child {flex-basis:100%}
}
</style>
</head>
<body>
<div class="app">

<header>
  <div>
    <h1>✦ STUDY PLANNER</h1>
    <div class="subtitle">나만의 공부 기록</div>
  </div>
  <div class="today" id="today"></div>
</header>

<section class="welcome">
  <h2>오늘도 차근차근!</h2>
  <p>작은 목표부터 하나씩 완성해 봐요.</p>
</section>

<section class="card">
  <h3>📅 날짜별 플래너</h3>
  <div class="date-row">
    <button class="secondary" id="prev">‹</button>
    <input type="date" id="date">
    <button class="secondary" id="next">›</button>
    <button class="secondary" id="todayBtn">오늘</button>
  </div>
  <div class="progress-info">
    <span>선택한 날짜</span>
    <span id="dateText"></span>
  </div>
</section>

<section class="card">
  <h3>📝 오늘의 할 일</h3>
  <form class="add-row" id="taskForm">
    <input id="taskInput" placeholder="할 일을 입력하세요" maxlength="100">
    <button class="primary">추가</button>
  </form>

  <div id="taskList"></div>

  <div class="progress-info">
    <span>오늘의 달성률</span>
    <strong id="percent">0%</strong>
  </div>
  <div class="progress">
    <div id="progressBar"></div>
  </div>
</section>

<section class="card">
  <h3>📖 공부 메모</h3>
  <textarea id="memo" placeholder="오늘 공부할 내용을 적어보세요."
    style="width:100%;height:120px;padding:12px;border:1px solid #eceef4;border-radius:10px;resize:vertical;font:14px Arial"></textarea>
</section>

<section class="card dday">
  <h3>🎯 D-DAY 설정</h3>
  <form class="dday-row" id="ddayForm">
    <input id="ddayName" placeholder="시험 이름" maxlength="30" required>
    <input id="ddayDate" type="date" required>
    <button>설정</button>
  </form>
  <div id="ddayResult"></div>
</section>

<footer>나의 공부 기록은 이 브라우저에 자동 저장됩니다 ☁️</footer>
</div>

<script>
const KEY = "myStudyPlannerV1";

const $ = id => document.getElementById(id);

const now = new Date();
now.setHours(0,0,0,0);

function dateString(d) {
  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}

let selected = dateString(now);
let storage = JSON.parse(localStorage.getItem(KEY) || "{}");

function save() {
  localStorage.setItem(KEY,JSON.stringify(storage));
}

function getDay() {
  if(!storage[selected]) {
    storage[selected] = {
      tasks:[],
      memo:""
    };
  }
  return storage[selected];
}

function render() {
  $("date").value = selected;

  const d = new Date(selected+"T00:00:00");
  $("dateText").textContent =
    `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`;

  $("today").textContent =
    `${now.getFullYear()}.${now.getMonth()+1}.${now.getDate()}`;

  $("memo").value = getDay().memo || "";

  renderTasks();
}

function renderTasks() {
  const tasks = getDay().tasks;
  const list = $("taskList");

  list.innerHTML = "";

  if(tasks.length === 0) {
    list.innerHTML =
      '<div class="empty">아직 할 일이 없습니다 ✨</div>';
  }

  tasks.forEach((task,index) => {
    const row = document.createElement("div");
    row.className = "task" + (task.done ? " done" : "");

    const check = document.createElement("input");
    check.type = "checkbox";
    check.checked = task.done;

    check.addEventListener("change",() => {
      task.done = check.checked;
      save();
      renderTasks();
    });

    const text = document.createElement("span");
    text.textContent = task.text;

    const edit = document.createElement("button");
    edit.textContent = "수정";

    edit.onclick = () => {
      const value = prompt("수정할 내용을 입력하세요",task.text);

      if(value && value.trim()) {
        task.text = value.trim();
        save();
        renderTasks();
      }
    };

    const del = document.createElement("button");
    del.textContent = "삭제";

    del.onclick = () => {
      if(confirm("삭제할까요?")) {
        tasks.splice(index,1);
        save();
        renderTasks();
      }
    };

    row.append(check,text,edit,del);
    list.append(row);
  });

  const done = tasks.filter(t=>t.done).length;
  const percent = tasks.length ?
    Math.round(done/tasks.length*100) : 0;

  $("percent").textContent = percent+"%";
  $("progressBar").style.width = percent+"%";
}

$("taskForm").addEventListener("submit",e=>{
  e.preventDefault();

  const value = $("taskInput").value.trim();
  if(!value) return;

  getDay().tasks.push({
    text:value,
    done:false
  });

  $("taskInput").value = "";
  save();
  renderTasks();
});

$("date").addEventListener("change",e=>{
  if(e.target.value) {
    selected = e.target.value;
    render();
  }
});

function moveDate(amount) {
  const d = new Date(selected+"T00:00:00");
  d.setDate(d.getDate()+amount);
  selected = dateString(d);
  render();
}

$("prev").onclick = ()=>moveDate(-1);
$("next").onclick = ()=>moveDate(1);

$("todayBtn").onclick = ()=>{
  selected = dateString(now);
  render();
};

$("memo").addEventListener("input",()=>{
  getDay().memo = $("memo").value;
  save();
});

$("ddayForm").addEventListener("submit",e=>{
  e.preventDefault();

  const name = $("ddayName").value.trim();
  const date = $("ddayDate").value;

  if(!name || !date) return;

  storage.dday = {name,date};
  save();
  renderDday();
});

function renderDday() {
  const item = storage.dday;
  if(!item) return;

  const target = new Date(item.date+"T00:00:00");
  const diff = Math.round((target-now)/86400000);

  let result = diff > 0 ? "D-"+diff :
               diff < 0 ? "D+"+Math.abs(diff) : "D-DAY";

  $("ddayResult").textContent = "";

  const number = document.createElement("div");
  number.id = "ddayNumber";
  number.textContent = result;

  const name = document.createElement("div");
  name.textContent = item.name;

  const date = document.createElement("div");
  date.textContent = item.date;

  const del = document.createElement("button");
  del.textContent = "D-day 삭제";
  del.style.marginTop = "10px";
  del.onclick = ()=>{
    delete storage.dday;
    save();
    $("ddayResult").innerHTML = "";
    $("ddayName").value = "";
    $("ddayDate").value = "";
  };

  $("ddayResult").append(number,name,date,del);
}

render();
renderDday();
</script>
</body>
</html>
